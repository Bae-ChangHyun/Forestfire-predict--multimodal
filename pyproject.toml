[project]
name = "forestfire-prediction"
version = "2.0.0"
description = "Multimodal Deep Learning for Wildfire Prediction in Gangwon Province"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Bae ChangHyun"}
]

dependencies = [
    # Deep Learning
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "tensorflow>=2.15.0",

    # Data Processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",

    # Geospatial
    "geopandas>=0.14.0",
    "rasterio>=1.3.9",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "fiona>=1.9.5",

    # Image Processing
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "tifffile>=2023.9.0",

    # Interpolation & Spatial
    "pyidw>=0.2.20",
    "scipy>=1.11.0",

    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",

    # Utils
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "natsort>=8.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "flake8>=6.1.0",
]

gnn = [
    "torch-geometric>=2.4.0",
    "torch-scatter>=2.1.0",
    "torch-sparse>=0.6.0",
]

optim = [
    "optuna>=3.3.0",
    "ray[tune]>=2.7.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
